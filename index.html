.opt input{margin-left:8px}.opt.on{border-color:#1f4e78;background:#e8f0f8}.opt small{display:block;color:#667}

const $=s=>document.querySelector(s),app=$('#app');
const L={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let KEY=L.get('key','');const S={shift:L.get('shift',''),eng:L.get('eng','')};let blocks=DATA.blocks,scrap=new Set();
const num=s=>+((s||'').match(/\d+/)||[0])[0],norm=s=>String(s).toUpperCase().replace(/[\s\-_]/g,'');
const uniq=a=>[...new Set(a)],stands=(L=blocks)=>uniq(L.map(b=>b.st)).sort((a,b)=>num(a)-num(b)),rbs=(L=blocks)=>uniq(L.map(b=>b.rb)).sort((a,b)=>num(a)-num(b));
const setsOf=(st,rb)=>blocks.filter(b=>b.st===st&&b.rb===(num(st)<=7?'ALL':rb)).flatMap(b=>b.sets);
const rbsFor=(st,L=blocks)=>num(st)<=7?rbs(L):uniq(L.filter(b=>b.st===st).map(b=>b.rb)).sort((a,b)=>num(a)-num(b));
const stsFor=(rb,L=blocks)=>uniq(L.filter(b=>b.rb===rb||b.rb==='ALL').map(b=>b.st)).sort((a,b)=>num(a)-num(b));
const lastSt=(rb,L=blocks)=>{const l=L.filter(b=>b.rb===rb).map(b=>b.st).sort((a,b)=>num(a)-num(b));return l[l.length-1]||''};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---- مكونات ----
function picker(label,opts,val=''){const w=document.createElement('div');w.className='f';let pick=val;
 w.innerHTML=`<label>${label}</label><input type=text autocomplete=off placeholder="ابحث ثم اضغط على الاقتراح" value="${esc(val)}"><div class=sug></div>`;
 const i=w.querySelector('input'),s=w.querySelector('.sug'),O=()=>typeof opts==='function'?opts():opts;
 w.get=()=>pick&&pick===i.value?pick:'';const mark=()=>{i.style.borderColor=w.get()?'#1e8e3e':'';i.style.background=w.get()?'#eef8f0':''};
 w.set=v=>{pick=v;i.value=v;s.innerHTML='';mark()};
 const show=()=>{s.innerHTML='';if(w.get())return;const q=norm(i.value);const l=O().filter(o=>!q||norm(o).includes(q));
  if(!l.length)s.innerHTML='<span class=bad>لا توجد خيارات مطابقة</span>';
  l.slice(0,8).forEach(o=>{const b=document.createElement('button');b.type='button';b.textContent=o;b.onclick=()=>{pick=o;i.value=o;s.innerHTML='';mark();w.onchange&&w.onchange()};s.append(b)})};
 i.oninput=()=>{pick='';mark();show();w.onchange&&w.onchange()};i.onfocus=show;mark();return w}
const inp=(l,n,t='text')=>`<div class=f><label>${l}</label><input type=${t==='n'?'number':'text'} ${t==='n'?'step=any inputmode=decimal':''} name=${n}></div>`;
const radios=(l,n,o)=>`<div class=g><b>${l}</b>${o.map(x=>`<label class=opt><input type=radio name=${n} value="${x}">${x}</label>`).join('')}</div>`;
const val=n=>{const els=[...document.querySelectorAll(`[name=${n}]`)];const e=els[0]&&els[0].type==='radio'?els.find(x=>x.checked):els[0];return e?e.value.trim():''};
function setCards(box,list,cb){box.innerHTML=list.length?`<div class=g><b>اختر الطقم</b>`+list.map((s,i)=>{const sc=scrap.has(norm(s.a))||scrap.has(norm(s.b));
 return `<label class=opt><input type=radio name=set value="${i}"><b>${esc(s.a||'؟')} / ${esc(s.b||'؟')}</b>${s.d?`<small>القطر الحالي: ${s.d}</small>`:''}${s.c?`<small>${esc(s.c)}</small>`:''}${sc?'<small class=bad>⚠ مسجّل سكراب</small>':''}</label>`}).join('')+'</div>':'<p class=bad>لا توجد أطقم مسجلة لهذا الستاند/المنتج.</p>';
 box.onchange=()=>{box.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o.querySelector('input').checked));cb&&cb()}}
const pickedSet=list=>{const v=val('set');return v===''?null:list[+v]};
// ---- الشاشات ----
function home(){app.innerHTML=`<h1>تسجيل الدرافيل</h1><div class=card><div class=g><b>الواردية</b></div><div class=row><button class="big ${S.shift==='A'?'':'alt'}" data-s=A>A</button><button class="big ${S.shift==='B'?'':'alt'}" data-s=B>B</button></div>
 ${inp('اسم المهندس','eng')}</div><button class=big data-o=new>1. طقم خام جديد</button><button class=big data-o=turn>2. خراطة</button><button class=big data-o=helix>3. حلزنة</button><button class="big warn" data-o=scrap>4. تسجيل طقم سكراب</button><p class=hint id=qn></p>`;
 const e=$('[name=eng]');e.value=S.eng;e.oninput=()=>{S.eng=e.value;L.set('eng',S.eng)};
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.shift=b.dataset.s;L.set('shift',S.shift);home()});
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(!S.shift||!S.eng.trim())return alert('اختر الواردية واكتب اسمك أولاً');form(b.dataset.o)});
 const n=L.get('q',[]).length;$('#qn').textContent=n?`⚠ ${n} تسجيل لم يُرسل بعد (سيُعاد إرساله تلقائياً عند توفر الاتصال)`:''}
function form(op){const T={new:'طقم خام جديد',turn:'خراطة',helix:'حلزنة',scrap:'تسجيل طقم سكراب'}[op];
 app.innerHTML=`<h1>${T}</h1><form class=card id=fm><div id=pk></div><div id=sc></div><div id=rest></div><button class=big id=go type=submit>إرسال</button><button class="big alt" type=button id=bk>رجوع</button></form>`;
 $('#bk').onclick=home;const pk=$('#pk'),sc=$('#sc'),rest=$('#rest');let st,rb,list=[],pairs=[];
 const SO=stands(),RO=rbs();
 if(op==='new'){const add=first=>{const d=document.createElement('div');d.className=first?'':'card';let a,b;a=picker('ST',()=>b.get()?stsFor(b.get()):SO);b=picker('RB',()=>a.get()?rbsFor(a.get()):RO);d.append(a,b);pk.append(d);pairs.push([a,b])};add(1);
  pk.insertAdjacentHTML('afterend','<button type=button class="big alt" id=ad>+ مشترك مع موضع آخر (ST / RB)</button>');$('#ad').onclick=()=>add(0);
  rest.innerHTML=`<p class=hint>سجّل كود الفردتين بدقة</p>`+inp('كود الفردة الأولى','c1')+inp('كود الفردة الثانية','c2')}
 else{const LV=blocks.filter(b=>b.sets.length);rb=picker('RB',()=>st.get()?rbsFor(st.get(),LV):rbs(LV));st=picker('ST',()=>rb.get()?stsFor(rb.get(),LV):stands(LV));
  const refresh=()=>{const a=st.get(),b=rb.get(),f=$('#rl');if(f)f.innerHTML='';list=a&&b?setsOf(a,b):[];if(a&&b)setCards(sc,list,()=>{if(f){const s=pickedSet(list);f.innerHTML=s?radios('كود الفردة التي تعمل عليها','roll',[s.a,s.b].filter(Boolean)):''}});else sc.innerHTML=''};
  if(op==='helix'){pk.append(rb,st);rb.onchange=()=>{st.set(rb.get()?lastSt(rb.get(),LV):'');refresh()};st.onchange=refresh}else{pk.append(st,rb);st.onchange=rb.onchange=refresh}
  const se='<div id=rl></div>';
  rest.innerHTML=op==='turn'?se+inp('القطر البدائي','d0','n')+radios('الحالة','fin',['انتهى','لم ينتهِ'])+'<div id=fx></div>'+inp('ملاحظات','nt')
  :op==='helix'?se+inp('القطر البدائي','d0','n')+'<b>NOTCH</b>'+inp('HS','hs','n')+inp('CS','cs','n')+inp('BETA ANGLE','beta','n')+inp('Z','z','n')+'<b>LOGO</b>'+inp('LOGO DEPTH','logo','n')+inp('ملاحظات','nt')
  :radios('سبب الإتلاف','why',['انتهاء القطر','شيء آخر'])+'<div id=fx></div>';
  rest.onchange=()=>{rest.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o.querySelector('input').checked));const f=$('#fx');if(!f)return;const v=val(op==='turn'?'fin':'why');f.innerHTML=v==='انتهى'?inp('القطر النهائي','d1','n'):v==='انتهاء القطر'?inp('القطر','d1','n'):v==='شيء آخر'?inp('اذكر السبب','why2'):''}}
 $('#fm').onsubmit=async e=>{e.preventDefault();const p={type:op,shift:S.shift,eng:S.eng.trim()};const bad=m=>{alert(m);return 1};
  if(op==='new'){p.pos=[];for(const[a,b]of pairs){if(!a.get()||!b.get())return bad('اختر ST و RB بالضغط على أحد الاقتراحات');p.pos.push(b.get()+':'+a.get())}
   p.c1=val('c1');p.c2=val('c2');if(!p.c1||!p.c2)return bad('أدخل كود الفردتين')}
  else{p.st=st.get();p.rb=rb.get();if(!p.st||!p.rb)return bad('اختر ST و RB بالضغط على أحد الاقتراحات');const s=pickedSet(list);if(!s)return bad('اختر الطقم');p.c1=s.a;p.c2=s.b;
   if(op!=='scrap'){p.roll=val('roll');p.d0=val('d0');if(!p.roll)return bad('اختر كود الفردة التي تعمل عليها');if(!p.d0)return bad('أدخل القطر البدائي');p.nt=val('nt')}
   if(op==='turn'){p.fin=val('fin');if(!p.fin)return bad('اختر انتهى أو لم ينتهِ');p.d1=p.fin==='انتهى'?val('d1'):'لم ينتهِ';if(!p.d1)return bad('أدخل القطر النهائي')}
   if(op==='helix'){for(const k of['hs','cs','beta','z','logo']){p[k]=val(k);if(!p[k])return bad('أكمل كل حقول NOTCH و LOGO')}}
   if(op==='scrap'){p.why=val('why');if(!p.why)return bad('اختر سبب الإتلاف');p.d1=p.why==='انتهاء القطر'?val('d1'):val('why2');if(!p.d1)return bad(p.why==='انتهاء القطر'?'أدخل القطر':'اذكر السبب')}}
  await send(p);app.innerHTML=`<div class="card ok"><h1>✅ تم الإرسال</h1><button class=big id=h>رجوع للرئيسية</button></div>`;$('#h').onclick=home}}
// ---- الإرسال ----
const chk=async()=>{try{return !(await(await fetch(ENDPOINT+'?key='+encodeURIComponent(KEY))).json()).error}catch(e){return null}};
function askKey(bad){app.innerHTML=`<h1>تسجيل الدرافيل</h1><div class=card><div class=f><label>رمز الدخول (يعطيك إياه المسؤول)</label><input type=text id=kk autocomplete=off></div>${bad?'<p class=bad>الرمز غير صحيح</p>':''}<button class=big id=kb>دخول</button></div>`;
 $('#kb').onclick=async()=>{KEY=$('#kk').value.trim();L.set('key',KEY);if(await chk()===false)return askKey(1);home();flush();sync()}}
async function flush(){if(!ENDPOINT)return;const q=L.get('q',[]);if(!q.length)return;const ok=await chk();if(ok===false)return askKey(KEY?1:0);if(ok===null)return;const left=[];
 for(const p of q){try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...p,key:KEY})})}catch(e){left.push(p)}}L.set('q',left)}
async function send(p){if(!ENDPOINT)alert('لم يُضبط رابط الإرسال بعد (ENDPOINT)');const q=L.get('q',[]);q.push(p);L.set('q',q);await flush()}
async function sync(){if(!ENDPOINT)return;try{const r=await(await fetch(ENDPOINT+'?key='+encodeURIComponent(KEY))).json();if(r.error)return askKey(KEY?1:0);(r.scrap||[]).forEach(c=>scrap.add(norm(c)));
 (r.newSets||[]).forEach(n=>n.pos.forEach(([rb,st])=>{let b=blocks.find(x=>x.rb===rb&&x.st===st);if(!b)blocks.push(b={rb,st,sets:[]});if(b.sets.some(s=>norm(s.a)===norm(n.a)&&norm(s.b)===norm(n.b)))return;b.sets.push({n:'جديد',a:n.a,b:n.b,d:'',c:'طقم جديد'})}))}catch(e){}}
home();flush();sync();
</script></body></html>
