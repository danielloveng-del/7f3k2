function parse(g){const sets=[];let rb=null,st=null;

 for(const s of sets.filter(s=>s.rb===blk(rb,st)&&s.st===st)){const k=(same(c1,s.d)||same(c1,s.e)?1:0)+(same(c2,s.d)||same(c2,s.e)?1:0);if(k>bs){bs=k;best=s}}return best}

const nGroups=g=>{let n=3;while(!blank(g.get(2,gcol(n))))n++;return n};
function turnPlan(g,s,d0,d1){const N=nGroups(g);let open=-1,free=-1;
 for(let i=0;i<N;i++){const h=g.get(s.r,gcol(i)),f=g.get(s.r,gcol(i)+1);if(!blank(h)){if(blank(f))open=i}else if(free<0)free=i}
 const fin=d1!==''&&d1!==null&&!isNaN(+d1);d0=+d0;d1=fin?+d1:null;
 const isOpen=open>=0&&Math.abs(+g.get(s.r,gcol(open))-d0)<0.011;
 if(fin&&isOpen)return{slot:open,mode:'complete',d0,d1};
 if(isOpen)return{skip:'مفتوحة مسبقاً بنفس القطر'};
 if(free<0)return{slot:N,mode:fin?'full':'open',d0,d1,newGroup:true};

function doTurn(g,s,p){if(p.newGroup&&g.addGroup)g.addGroup(p.slot);const C=gcol(p.slot),a=Math.round((p.d0-(p.d1??p.d0))*100)/100;

function doNew(g,plan,c1,c2){const tag=plan.map(p=>(p.st+p.rb).toLowerCase());

function doScrap(g,rows,mode,note){for(const s of rows){

 if(tab==='turn'){h+='<div class=card><button class="b g" data-a=turnall data-i=0>موافقة على كل الخراطات الممكنة (مع تأكيد)</button></div>';
  Ls.forEach(({x,i})=>{const v=x.v,s=findSet(sets,v[4],v[3],v[5],v[6]),p=s?turnPlan(g,s,v[8],v[9]):null,[t,bad]=planTxt(s,p);
   h+=`<div class=card><b>${esc(v[3])} ${esc(v[4])}</b> · ${esc(v[5])} / ${esc(v[6])}<div>الفردة: ${esc(v[7])} · بدائي ${esc(v[8])} · ${esc(v[9])}</div><div class=hint>${esc(v[0])} · ${esc(v[2])} · واردية ${esc(v[1])}</div>
   <div class=${bad?'bad':'ok'}>${esc(t)}</div><button class="b g" data-a=turnok data-i=${i} ${bad?'disabled':''}>موافقة</button><button class="b x" data-a=skip data-i=${i}>تجاهل</button></div>`})}
 if(tab==='new')Ls.forEach(({x,i})=>{const v=x.v,pl=newPlan(sets,String(v[3]).split(' | ').map(q=>q.split(':')));
  h+=`<div class=card><b>${esc(v[4])} / ${esc(v[5])}</b><div class=hint>${esc(v[0])} · ${esc(v[2])}</div>${pl.map(p=>`<div class=${p.s?'ok':'bad'}>${p.rb} ${p.st}: ${p.s?'صف '+p.s.r+' (طقم '+p.s.b+')':'لا يوجد صف فارغ'}</div>`).join('')}
  <b>هل أضيفه للجرد في مكانه؟</b><br><button class="b g" data-a=newadd data-i=${i} ${pl.some(p=>p.s)?'':'disabled'}>نعم، أضفه</button><button class="b x" data-a=skip data-i=${i}>تجاهل</button></div>`});
 if(tab==='scrap')Ls.forEach(({x,i})=>{const v=x.v,fb=scrapRows(v);
  h+=`<div class=card><b>${esc(v[5])} / ${esc(v[6])}</b> · ${esc(v[3])} ${esc(v[4])}<div>السبب: ${esc(v[7])} - ${esc(v[8])}</div><div class=hint>${esc(v[0])} · ${esc(v[2])}</div>
  <div class=${fb.length?'ok':'bad'}>${fb.length?'موجود في '+fb.map(s=>s.rb+'/'+s.st+' (صف '+s.r+')').join('، '):'لم يُعثر عليه في الجرد'}</div>
  <button class="b r" data-a=scrapmark data-i=${i} ${fb.length?'':'disabled'}>أشّر في الجرد</button><button class="b r" data-a=scrapdel data-i=${i} ${fb.length?'':'disabled'}>احذف من الجرد</button><button class="b x" data-a=skip data-i=${i}>تجاهل</button></div>`});
 return h}
const scrapRows=v=>{const r=findAll(sets,v[5],v[6]);return r.length?r:[findSet(sets,v[4],v[3],v[5],v[6])].filter(Boolean)};
function done(k,x,status){x.done=true;marks.push({tab:k,row:x.row,status})}
function applyTurn(r){const v=r.v,s=findSet(sets,v[4],v[3],v[5],v[6]);if(!s)return 0;const p=turnPlan(g,s,v[8],v[9]);if(p.err)return 0;
 if(!p.skip){doTurn(g,s,p);changes++}done('turn',r,'تم');return 1}
function act(a,i){const k=tab,x=recs[k][i],v=x&&x.v;
 if(a==='skip'){done(k,x,'مرفوض');return render()}
 if(a==='turnok'){applyTurn(x);return say('اعتُمدت خراطة '+v[3]+' '+v[4])}
 if(a==='turnall'){const ok=recs.turn.filter(r=>!r.done&&(()=>{const s=findSet(sets,r.v[4],r.v[3],r.v[5],r.v[6]);return s&&!turnPlan(g,s,r.v[8],r.v[9]).err})());
  if(!ok.length||!confirm('الموافقة على '+ok.length+' تسجيل خراطة؟'))return;ok.forEach(applyTurn);return say(ok.length+' خراطة اعتُمدت')}
 if(a==='newadd'){const pl=newPlan(sets,String(v[3]).split(' | ').map(q=>q.split(':')));doNew(g,pl,v[4],v[5]);changes++;done(k,x,'تم');return say('أُضيف الطقم '+v[4]+' / '+v[5])}
 if(a==='scrapmark'||a==='scrapdel'){if(a==='scrapdel'&&!confirm('سيُحذف الطقم وقياساته من الجرد. متابعة؟'))return;
  doScrap(g,scrapRows(v),a==='scrapmark'?'mark':'del','سكراب '+new Date().toISOString().slice(0,10)+': '+v[7]+' '+v[8]);changes++;done(k,x,'تم');say('عولج السكراب '+v[5])}}
async function save(){if(!confirm('حفظ الجرد المحدّث على السحابة؟ (تبقى نسخة قديمة احتياطية)'))return;
 try{if(changes||dirty)await post({action:'saveInv',b64:toB64(await wb.xlsx.writeBuffer())});
  for(const k of['turn','new','scrap'])for(const st of['تم','مرفوض']){const rows=marks.filter(m=>m.tab===k&&m.status===st).map(m=>m.row);if(rows.length)await post({action:'mark',tab:k,rows,status:st})}
  marks=[];changes=0;dirty=false;await new Promise(r=>setTimeout(r,3000));const m=await(await fetch(q()+'&inv=meta')).json();say('تم الحفظ. آخر تحديث للجرد على السحابة: '+(m.updated||'؟'));await fetchRecs()}
 catch(e){say('تعذر الحفظ، لم يتغير شيء على السحابة','bad')}}
async function download(){const buf=await wb.xlsx.writeBuffer(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='جرد_'+new Date().toISOString().slice(0,10)+'.xlsx';a.click()}
render();
</script></body></html>
